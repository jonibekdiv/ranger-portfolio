<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,900&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#050505;color:#fff;font-family:Inter,sans-serif;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 70% 70% at 70% 40%,#000 30%,transparent 80%)}
  .glow{position:absolute;right:-120px;top:-80px;width:760px;height:620px;background:radial-gradient(ellipse,rgba(255,32,32,.38),transparent 62%);filter:blur(10px)}
  .blob{position:absolute;left:-150px;top:-170px;width:460px;height:380px;border-radius:50%;border:1.5px solid rgba(255,32,32,.6);background:radial-gradient(circle at 70% 70%,#2a0000,#080000 70%);box-shadow:0 0 70px rgba(255,32,32,.3)}
  .curve{position:absolute;inset:0}
  .ghost{position:absolute;left:-20px;bottom:-60px;font:italic 900 250px/1 Montserrat;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.07);white-space:nowrap}
  .wrap{position:absolute;left:80px;top:78px}
  .badge{display:inline-flex;align-items:center;gap:12px;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font:600 15px Inter;letter-spacing:.22em}
  .badge i{width:10px;height:10px;border-radius:50%;background:#ff2020;box-shadow:0 0 0 6px rgba(255,32,32,.2)}
  .hello{margin-top:34px;font:700 28px Montserrat;letter-spacing:.06em;color:rgba(255,255,255,.9)}
  h1{font:italic 900 180px/.86 Montserrat;letter-spacing:-6px;color:#ff2020;text-shadow:0 0 60px rgba(255,32,32,.55);margin-top:6px}
  .role{margin-top:30px;font:700 26px Montserrat;letter-spacing:.1em}
  .role b{color:#ff2020}
  .tags{margin-top:26px;display:flex;gap:10px}
  .tags span{font:500 16px 'JetBrains Mono';color:#ffb3b3;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,32,32,.3);background:rgba(255,32,32,.08)}
  .url{position:absolute;right:70px;bottom:56px;font:600 20px Inter;color:#a1a1aa}
  .url b{color:#fff}
  .logo{position:absolute;right:70px;top:70px;width:96px;height:96px;filter:drop-shadow(0 0 22px rgba(255,32,32,.8))}
  .neon{position:absolute;right:90px;top:250px;width:230px;overflow:visible}
  .neon path{fill:none;stroke:#ff2a2a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px #ff2020) drop-shadow(0 0 22px #ff2020)}
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div><div class="blob"></div>
  <svg class="curve" viewBox="0 0 1200 630" preserveAspectRatio="none"><path d="M-30 520 C 280 640, 650 640, 1230 430" fill="none" stroke="#ff2020" stroke-width="2.5" style="filter:drop-shadow(0 0 10px #ff2020)"/></svg>
  <div class="ghost">RANGER RANGER</div>
  <svg class="logo" viewBox="0 0 40 40"><path fill="#ff2020" d="M4 4h19c7.2 0 11.5 3.8 11.5 9.8 0 4.4-2.4 7.6-6.4 8.9L36 36H25.4l-6.2-11.6h-5.8L10.3 36H.6z"/><path fill="#050505" d="M14.6 11.2h7.6c2.5 0 3.9 1.1 3.9 3s-1.4 3.1-3.9 3.1h-9.4z"/><path d="M2 30 34 6" stroke="#050505" stroke-width="2.4"/></svg>
  <svg class="neon" viewBox="0 0 120 70"><path d="M38 12 14 35l24 23M82 12l24 23-24 23M68 6 52 64"/></svg>
  <div class="wrap">
    <div class="badge"><i></i>AVAILABLE FOR PROJECTS</div>
    <p class="hello">HELLO, I'M JONIBEK.</p>
    <h1>RANGER</h1>
    <p class="role">FRONTEND DEVELOPER <b>&amp;</b> CREATIVE WEB DESIGNER</p>
    <div class="tags"><span>React</span><span>Next.js</span><span>TypeScript</span><span>Three.js</span><span>GSAP</span></div>
  </div>
  <p class="url"><b>ranger-portfolio</b>.vercel.app</p>
</body>
</html>
